# Moves files from hercules' landing zone to xena's, encrypted in transit.
#
#   discover ──► for each chunk of up to 10 files (fanned out, 6 chunks at a time):
#       │          encrypt-and-send ──► decrypt-and-verify
#       │                                        └──► summarize
#       └──► nothing-to-do (when the source is empty)
#
# encrypt-and-send    hercules encrypts each file with xena's age public key, and
#                     only the ciphertext crosses to xena's landing zone
#                     (encrypted/NAME.txt.age). The plaintext never leaves hercules.
# decrypt-and-verify  decrypts with xena's private key (a Secret that exists only
#                     in xena), checks the SHA-256 against the original, writes
#                     inbound/NAME.txt, then moves the original to sent/ on hercules.
#
# Files are grouped into chunks so 50 files need 10 pods instead of 100. A
# failure retries the whole chunk. Every step is safe to repeat, and a file is
# archived on hercules only after its decrypted copy is verified, so files from
# a chunk that never succeeds stay in outbound/ for the next run.
#
# Repeated names (checked against xena:inbound/ before encrypting, and again
# right before writing):
#   same name, same content       duplicate: not resent; original -> sent/
#   same name, different content  conflict: not sent, inbound/ untouched;
#                                 original -> hercules conflicts/ + NAME.reason
# Originals are archived by image/lz-archive.sh, which moves a file only if its
# SHA-256 still matches what was sent. A file re-dropped under the same name
# mid-run stays in outbound/ for the next run.
#
# Started by the Sensor in 20-events-xena.yaml when files land on hercules.
# The mutex makes overlapping triggers queue up instead of fighting over files.
#
# onExit: notify      always runs, even if the run failed. Emails when the run
#                     failed or set conflicts aside (notify-on=attention), using
#                     the SMTP settings in the cross-dc-transfer-smtp Secret.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cross-dc-transfer
  namespace: argo
spec:
  serviceAccountName: argo-workflow
  entrypoint: move-files
  onExit: notify
  activeDeadlineSeconds: 1800
  ttlStrategy:
    secondsAfterSuccess: 86400
  synchronization:
    mutexes:
      - name: cross-dc-transfer
  arguments:
    parameters:
      - name: files-reported
        description: How many files hercules said were waiting (informational; set by the Sensor)
        value: "0"
      - name: source-host
        value: host.k3d.internal
      - name: source-port
        value: "2322"
      - name: destination-host
        value: landing-zone.landing-zone.svc.cluster.local
      - name: max-files
        description: Most files to move in one run; the rest wait for the next run
        value: "100"
      - name: chunk-size
        description: Files handled by each pair of encrypt/decrypt pods
        value: "10"
      - name: notify-on
        description: "When to email: attention (failed run or conflicts), always, or never"
        value: attention
        enum: [attention, always, never]
      - name: argo-ui-url
        description: Base URL of the Argo UI, for the link in the email
        value: https://argo.tail18466c.ts.net

  volumes:
    # SSH client key, known_hosts for both landing zones, xena's age public key
    - name: transfer-credentials
      secret: {secretName: cross-dc-transfer-credentials, defaultMode: 0400}
    # xena's age private key; mounted only into the decrypt step
    - name: age-identity
      secret: {secretName: xena-age-identity, defaultMode: 0400}

  templates:
    - name: move-files
      parallelism: 6
      dag:
        tasks:
          - name: discover
            template: list-source-files

          - name: nothing-to-do
            depends: discover
            when: "{{tasks.discover.outputs.parameters.count}} == 0"
            template: log
            arguments:
              parameters:
                - name: message
                  value: "No .txt files waiting on hercules"

          - name: move
            depends: discover
            when: "{{tasks.discover.outputs.parameters.count}} > 0"
            template: move-chunk
            withParam: "{{tasks.discover.outputs.parameters.chunks}}"
            arguments:
              parameters:
                - name: files
                  value: "{{item}}"

          - name: summarize
            depends: move
            when: "{{tasks.discover.outputs.parameters.count}} > 0"
            template: summarize
            arguments:
              parameters:
                - name: results
                  value: "{{tasks.move.outputs.parameters}}"

    # --- One chunk: encrypt on hercules, then decrypt in xena -----------------
    - name: move-chunk
      inputs:
        parameters:
          - name: files  # JSON array of file names
      outputs:
        parameters:
          - name: result
            valueFrom: {parameter: "{{tasks.decrypt-and-verify.outputs.parameters.result}}"}
      dag:
        tasks:
          - name: encrypt-and-send
            template: encrypt-and-send
            arguments:
              parameters:
                - {name: files, value: "{{inputs.parameters.files}}"}
          - name: decrypt-and-verify
            depends: encrypt-and-send
            template: decrypt-and-verify
            arguments:
              parameters:
                - {name: sent, value: "{{tasks.encrypt-and-send.outputs.parameters.sent}}"}

    # --- Step 1: list what's waiting on hercules, split into chunks ----------
    - name: list-source-files
      outputs:
        parameters:
          - name: chunks
            valueFrom: {path: /tmp/chunks.json}
          - name: count
            valueFrom: {path: /tmp/count}
      retryStrategy: &retry
        limit: "4"
        retryPolicy: Always
        backoff: {duration: "5s", factor: "2", maxDuration: "5m"}
      script:
        image: dc-transfer/tools:1.1
        imagePullPolicy: IfNotPresent
        command: [bash]
        env:
          - {name: SRC_HOST, value: "{{workflow.parameters.source-host}}"}
          - {name: SRC_PORT, value: "{{workflow.parameters.source-port}}"}
          - {name: MAX_FILES, value: "{{workflow.parameters.max-files}}"}
          - {name: CHUNK_SIZE, value: "{{workflow.parameters.chunk-size}}"}
        volumeMounts:
          - {name: transfer-credentials, mountPath: /credentials, readOnly: true}
        resources: &small
          requests: {cpu: 10m, memory: 16Mi}
        source: |
          set -euo pipefail
          src() { ssh -i /credentials/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10 \
                    -o UserKnownHostsFile=/credentials/known_hosts -p "$SRC_PORT" "lz@$SRC_HOST" "$@"; }

          echo "Listing hercules:/data/outbound"
          # List first, on its own line, so an unreachable hercules fails the step
          # (and is retried, then reported) instead of looking like an empty folder
          listing=$(src 'ls -1 outbound')
          # Only plain names, so file names are safe to use in remote commands
          { grep -E '^[A-Za-z0-9._-]+\.txt$' <<< "$listing" || true; } | sort | head -n "$MAX_FILES" > /tmp/names
          jq -R . /tmp/names | jq -sc --argjson n "$CHUNK_SIZE" '[range(0; length; $n) as $i | .[$i:$i+$n]]' > /tmp/chunks.json
          wc -l < /tmp/names | tr -d ' ' > /tmp/count
          echo "$(cat /tmp/count) file(s) to move this run, in $(jq length /tmp/chunks.json) chunk(s) of up to $CHUNK_SIZE"

    # --- Step 2a: encrypt on hercules, ship only ciphertext ------------------
    - name: encrypt-and-send
      inputs:
        parameters:
          - name: files
      outputs:
        parameters:
          # JSON array: [{file, sha256, bytes, encrypted_bytes, status}, ...]
          # status: sent | duplicate | conflict
          - {name: sent, valueFrom: {path: /tmp/sent.json}}
      retryStrategy: *retry
      activeDeadlineSeconds: 600
      script:
        image: dc-transfer/tools:1.1
        imagePullPolicy: IfNotPresent
        command: [bash]
        env:
          - {name: FILES, value: "{{inputs.parameters.files}}"}
          - {name: SRC_HOST, value: "{{workflow.parameters.source-host}}"}
          - {name: SRC_PORT, value: "{{workflow.parameters.source-port}}"}
          - {name: DST_HOST, value: "{{workflow.parameters.destination-host}}"}
        volumeMounts:
          - {name: transfer-credentials, mountPath: /credentials, readOnly: true}
        resources: *small
        source: |
          set -euo pipefail
          # One SSH connection per host, reused for every command in this chunk
          opts=(-i /credentials/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10
                -o UserKnownHostsFile=/credentials/known_hosts
                -o ControlMaster=auto -o ControlPath=/tmp/ssh-%h-%p -o ControlPersist=120)
          src() { ssh "${opts[@]}" -p "$SRC_PORT" "lz@$SRC_HOST" "$@"; }
          dst() { ssh "${opts[@]}" "lz@$DST_HOST" "$@"; }
          recipient=$(cat /credentials/age-recipient)
          mapfile -t files < <(jq -r '.[]' <<< "$FILES")
          echo "Encrypting ${#files[@]} file(s) on hercules for xena's key ($recipient)"
          echo "and streaming only ciphertext to xena:encrypted/"

          record() {  # record FILE SHA BYTES ENC_BYTES STATUS
            jq -nc --arg f "$1" --arg s "$2" --argjson b "$3" --argjson e "$4" --arg st "$5" \
              '{file: $f, sha256: $s, bytes: $b, encrypted_bytes: $e, status: $st}' >> /tmp/sent.jsonl
          }

          : > /tmp/sent.jsonl
          for f in "${files[@]}"; do
            [[ $f =~ ^[A-Za-z0-9._-]+\.txt$ ]] || { echo "Refusing unsafe name: $f" >&2; exit 1; }

            read -r sha bytes < <(src "sha256sum outbound/$f | cut -d' ' -f1; stat -c %s outbound/$f" | paste -sd' ')

            # Has xena already received a file with this name?
            existing=$(dst "if [ -f inbound/$f ]; then sha256sum inbound/$f | cut -d' ' -f1; fi")
            if [[ $existing == "$sha" ]]; then
              # Same name, same content: nothing to send
              printf '  %-40s duplicate of xena:inbound/%s, not resent; ' "$f" "$f"
              src "lz-archive.sh sent $f $sha"
              record "$f" "$sha" "$bytes" 0 duplicate
              continue
            elif [[ -n $existing ]]; then
              # Same name, different content: never overwrite; set aside for review
              printf '  %-40s CONFLICT with xena:inbound/%s, not sent; ' "$f" "$f"
              src "lz-archive.sh conflicts $f $sha 'xena:inbound/$f already holds different content (existing sha256 $existing, incoming $sha)'"
              record "$f" "$sha" "$bytes" 0 conflict
              continue
            fi

            src "age -r $recipient outbound/$f" \
              | dst "cat > encrypted/.$f.age.part && mv encrypted/.$f.age.part encrypted/$f.age"

            read -r header enc_bytes < <(dst "head -n1 encrypted/$f.age; stat -c %s encrypted/$f.age" | paste -sd' ')
            [[ $header == "age-encryption.org/v1" ]] || { echo "$f: not an age file ($header)" >&2; exit 1; }

            printf '  %-40s %7s B plaintext -> %7s B ciphertext  sha256:%.12s\n' "$f" "$bytes" "$enc_bytes" "$sha"
            record "$f" "$sha" "$bytes" "$enc_bytes" sent
          done
          jq -sc . /tmp/sent.jsonl > /tmp/sent.json

    # --- Step 2b: decrypt in xena, verify, then archive on hercules ----------
    - name: decrypt-and-verify
      inputs:
        parameters:
          - name: sent
      outputs:
        parameters:
          - {name: result, valueFrom: {path: /tmp/result.json}}
      retryStrategy: *retry
      activeDeadlineSeconds: 600
      script:
        image: dc-transfer/tools:1.1
        imagePullPolicy: IfNotPresent
        command: [bash]
        env:
          - {name: SENT, value: "{{inputs.parameters.sent}}"}
          - {name: SRC_HOST, value: "{{workflow.parameters.source-host}}"}
          - {name: SRC_PORT, value: "{{workflow.parameters.source-port}}"}
          - {name: DST_HOST, value: "{{workflow.parameters.destination-host}}"}
        volumeMounts:
          - {name: transfer-credentials, mountPath: /credentials, readOnly: true}
          - {name: age-identity, mountPath: /age, readOnly: true}
        resources: *small
        source: |
          set -euo pipefail
          opts=(-i /credentials/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10
                -o UserKnownHostsFile=/credentials/known_hosts
                -o ControlMaster=auto -o ControlPath=/tmp/ssh-%h-%p -o ControlPersist=120)
          src() { ssh "${opts[@]}" -p "$SRC_PORT" "lz@$SRC_HOST" "$@"; }
          dst() { ssh "${opts[@]}" "lz@$DST_HOST" "$@"; }
          work=$(mktemp -d)
          echo "Decrypting $(jq '[.[] | select(.status == "sent")] | length' <<< "$SENT") file(s) with xena's private key, verifying, then archiving on hercules"
          jq -r '.[] | select(.status != "sent") | "  \(.file)  \(.status), skipped"' <<< "$SENT"

          # Read the list up front: ssh inside the loop would otherwise eat a
          # `while read` loop's stdin and silently end it after one file
          mapfile -t rows < <(jq -r '.[] | select(.status == "sent") | "\(.file) \(.sha256)"' <<< "$SENT")
          declare -A final=()
          for row in "${rows[@]}"; do
            read -r f sha <<< "$row"
            [[ $f =~ ^[A-Za-z0-9._-]+\.txt$ ]] || { echo "Refusing unsafe name: $f" >&2; exit 1; }

            dst "cat encrypted/$f.age" | age -d -i /age/identity > "$work/$f"
            got=$(sha256sum "$work/$f" | cut -d' ' -f1)
            if [[ $got != "$sha" ]]; then
              echo "$f: checksum mismatch: hercules $sha, decrypted $got" >&2
              exit 1
            fi

            # Check again right before writing: never overwrite different content
            existing=$(dst "if [ -f inbound/$f ]; then sha256sum inbound/$f | cut -d' ' -f1; fi")
            if [[ -n $existing && $existing != "$sha" ]]; then
              printf '  %s  CONFLICT: xena:inbound/%s changed since this run checked it; ' "$f" "$f"
              src "lz-archive.sh conflicts $f $sha 'xena:inbound/$f already holds different content (existing sha256 $existing, incoming $sha)'"
              final[$f]=conflict
              continue
            fi
            if [[ -z $existing ]]; then  # (on a retry it may already be there)
              dst "cat > inbound/.$f.part && mv inbound/.$f.part inbound/$f" < "$work/$f"
              [[ $(dst "sha256sum inbound/$f" | cut -d' ' -f1) == "$sha" ]] || { echo "$f: destination copy differs" >&2; exit 1; }
            fi

            # Only now is it safe to retire the original, and only if it's still
            # the version we sent (lz-archive.sh checks the SHA-256)
            printf '  %s  verified (sha256:%.12s); ' "$f" "$sha"
            src "lz-archive.sh sent $f $sha"
            final[$f]=delivered
            rm -f "$work/$f"
          done

          # Same list back, with "sent" replaced by the final status
          statuses=$(for f in "${!final[@]}"; do printf '%s\t%s\n' "$f" "${final[$f]}"; done \
                     | jq -Rn '[inputs | split("\t") | {(.[0]): .[1]}] | add // {}')
          jq -c --argjson st "$statuses" 'map(.status = ($st[.file] // .status))' <<< "$SENT" > /tmp/result.json

    # --- Step 3: roll up the fan-out ----------------------------------------
    - name: summarize
      inputs:
        parameters:
          - name: results
      outputs:
        parameters:
          # Exported workflow-wide so the onExit notify step can read it
          - name: report
            globalName: report
            valueFrom: {path: /tmp/report.json}
      script:
        image: python:3.12-alpine
        command: [python]
        resources: *small
        source: |
          import json
          chunks = [json.loads(r["result"]) for r in json.loads(r'''{{inputs.parameters.results}}''')]
          rows = [row for chunk in chunks for row in chunk]
          by = {s: [r for r in rows if r["status"] == s] for s in ("delivered", "duplicate", "conflict")}
          plain = sum(r["bytes"] for r in by["delivered"])
          enc = sum(r["encrypted_bytes"] for r in by["delivered"])
          print(f"{len(rows)} file(s) in {len(chunks)} chunk(s): {len(by['delivered'])} delivered, "
                f"{len(by['duplicate'])} duplicate(s) skipped, {len(by['conflict'])} conflict(s) set aside")
          print(f"Delivered {plain:,} bytes plaintext as {enc:,} bytes over the wire (encrypted)\n")
          for r in sorted(rows, key=lambda r: r["file"]):
              print(f"  {r['file']:<44} {r['bytes']:>8,} B  sha256:{r['sha256'][:12]}  {r['status']}")
          if by["conflict"]:
              print("\nConflicts are in hercules:/data/conflicts/ with a .reason file each; "
                    "xena:inbound/ was not changed.")

          with open("/tmp/report.json", "w") as f:
              json.dump({"chunks": len(chunks), "files": rows}, f)

    # --- Exit handler: email when someone should look ------------------------
    # Runs after every run, passed or failed. The report is missing when the run
    # failed before summarize, so it falls back to "none".
    - name: notify
      retryStrategy: *retry
      script:
        image: python:3.12-alpine
        command: [python]
        resources: *small
        env:  # env vars, so JSON in these values can't break the script
          - {name: STATUS, value: "{{workflow.status}}"}
          - {name: FAILURES, value: "{{workflow.failures}}"}
          - {name: REPORT, value: "{{=sprig.default('none', workflow.outputs?.parameters?.report)}}"}
          - {name: NOTIFY_ON, value: "{{workflow.parameters.notify-on}}"}
          - {name: RUN_NAME, value: "{{workflow.name}}"}
          - {name: RUN_URL, value: "{{workflow.parameters.argo-ui-url}}/workflows/{{workflow.namespace}}/{{workflow.name}}"}
          - {name: DURATION, value: "{{workflow.duration}}"}
          # SMTP settings; host/port/from/to required, username/password/starttls optional
          - {name: SMTP_HOST, valueFrom: {secretKeyRef: {name: cross-dc-transfer-smtp, key: host}}}
          - {name: SMTP_PORT, valueFrom: {secretKeyRef: {name: cross-dc-transfer-smtp, key: port}}}
          - {name: MAIL_FROM, valueFrom: {secretKeyRef: {name: cross-dc-transfer-smtp, key: from}}}
          - {name: MAIL_TO, valueFrom: {secretKeyRef: {name: cross-dc-transfer-smtp, key: to}}}
          - {name: SMTP_USERNAME, valueFrom: {secretKeyRef: {name: cross-dc-transfer-smtp, key: username, optional: true}}}
          - {name: SMTP_PASSWORD, valueFrom: {secretKeyRef: {name: cross-dc-transfer-smtp, key: password, optional: true}}}
          - {name: SMTP_STARTTLS, valueFrom: {secretKeyRef: {name: cross-dc-transfer-smtp, key: starttls, optional: true}}}
        source: |
          import json, os, smtplib
          from email.message import EmailMessage

          env = os.environ.get
          status = env("STATUS")
          report = json.loads(env("REPORT")) if env("REPORT", "none") != "none" else None
          failures = json.loads(env("FAILURES") or "null")
          if isinstance(failures, str):
              failures = json.loads(failures)
          failures = [f for f in failures or [] if f.get("message")]  # skip group nodes

          files = report["files"] if report else []
          count = lambda s: sum(1 for r in files if r["status"] == s)
          conflicts = [r for r in files if r["status"] == "conflict"]

          needs_attention = status != "Succeeded" or bool(conflicts)
          mode = env("NOTIFY_ON")
          if mode == "never" or (mode == "attention" and not needs_attention):
              print(f"Run {status}, {len(conflicts)} conflict(s): no email (notify-on={mode})")
              raise SystemExit(0)

          if status != "Succeeded":
              subject = f"[cross-dc-transfer] FAILED: {env('RUN_NAME')}"
          elif conflicts:
              subject = f"[cross-dc-transfer] {len(conflicts)} conflict(s) need review: {env('RUN_NAME')}"
          else:
              subject = f"[cross-dc-transfer] Succeeded: {env('RUN_NAME')}"

          lines = [f"Run:      {env('RUN_NAME')}",
                   f"Status:   {status} after {float(env('DURATION') or 0):.0f}s",
                   f"Details:  {env('RUN_URL')}", ""]
          if report:
              lines.append(f"{len(files)} file(s): {count('delivered')} delivered, "
                           f"{count('duplicate')} duplicate(s) skipped, {len(conflicts)} conflict(s) set aside")
          else:
              lines.append("The run failed before it could summarize which files moved.")
          if conflicts:
              lines += ["", "Conflicts (same name as a file xena already has, different content).",
                        "Not sent; xena:inbound/ was not changed. Originals and a .reason file for each",
                        "are in hercules:/data/conflicts/:"]
              lines += [f"  {r['file']}  (incoming sha256 {r['sha256'][:12]})" for r in conflicts]
          if failures:
              lines += ["", "Failures:"]
              lines += [f"  {f['finishedAt']}  {f['displayName']}: {f['message']}"
                        for f in sorted(failures, key=lambda f: f.get("finishedAt") or "")]
          if status != "Succeeded":
              lines += ["", "Files that didn't finish are still in hercules:/data/outbound/ and will go",
                        "with the next run."]

          msg = EmailMessage()
          msg["Subject"], msg["From"], msg["To"] = subject, env("MAIL_FROM"), env("MAIL_TO")
          msg.set_content("\n".join(lines) + "\n")

          with smtplib.SMTP(env("SMTP_HOST"), int(env("SMTP_PORT")), timeout=30) as smtp:
              if env("SMTP_STARTTLS", "").lower() == "true":
                  smtp.starttls()
              if env("SMTP_USERNAME"):
                  smtp.login(env("SMTP_USERNAME"), env("SMTP_PASSWORD", ""))
              smtp.send_message(msg, to_addrs=[a.strip() for a in env("MAIL_TO").split(",")])
          print(f"Emailed {env('MAIL_TO')}: {subject}")
          print("\n".join(lines))

    - name: log
      inputs:
        parameters:
          - name: message
      container:
        image: busybox:1.36
        command: [echo, "{{inputs.parameters.message}}"]
        resources: *small
