# Moves files from hercules' landing zone to xena's, encrypted in transit.
#
#   discover ──► for each file (fanned out, 6 at a time):
#       │          encrypt-and-send ──► decrypt-and-verify
#       │                                        └──► summarize
#       └──► nothing-to-do (when the source is empty)
#
# encrypt-and-send    hercules encrypts the file with xena's age public key, and
#                     only the ciphertext crosses to xena's landing zone
#                     (encrypted/NAME.txt.age). The plaintext never leaves hercules.
# decrypt-and-verify  decrypts with xena's private key (a Secret that exists only
#                     in xena), checks the SHA-256 against the original, writes
#                     inbound/NAME.txt, then moves the original to sent/ on hercules.
#
# Started by the Sensor in 20-events-xena.yaml when files land on hercules.
# The mutex makes overlapping triggers queue up instead of fighting over files.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cross-dc-transfer
  namespace: argo
spec:
  serviceAccountName: argo-workflow
  entrypoint: move-files
  activeDeadlineSeconds: 1800
  ttlStrategy:
    secondsAfterSuccess: 86400
  synchronization:
    mutexes:
      - name: cross-dc-transfer
  arguments:
    parameters:
      - name: files-reported
        description: How many files hercules said were waiting (informational; set by the Sensor)
        value: "0"
      - name: source-host
        value: host.k3d.internal
      - name: source-port
        value: "2322"
      - name: destination-host
        value: landing-zone.landing-zone.svc.cluster.local
      - name: max-files
        description: Most files to move in one run; the rest wait for the next run
        value: "100"

  volumes:
    # SSH client key, known_hosts for both landing zones, xena's age public key
    - name: transfer-credentials
      secret: {secretName: cross-dc-transfer-credentials, defaultMode: 0400}
    # xena's age private key; mounted only into the decrypt step
    - name: age-identity
      secret: {secretName: xena-age-identity, defaultMode: 0400}

  templates:
    - name: move-files
      parallelism: 6
      dag:
        tasks:
          - name: discover
            template: list-source-files

          - name: nothing-to-do
            depends: discover
            when: "{{tasks.discover.outputs.parameters.count}} == 0"
            template: log
            arguments:
              parameters:
                - name: message
                  value: "No .txt files waiting on hercules"

          - name: move
            depends: discover
            when: "{{tasks.discover.outputs.parameters.count}} > 0"
            template: move-one-file
            withParam: "{{tasks.discover.outputs.parameters.files}}"
            arguments:
              parameters:
                - name: file
                  value: "{{item}}"

          - name: summarize
            depends: move
            when: "{{tasks.discover.outputs.parameters.count}} > 0"
            template: summarize
            arguments:
              parameters:
                - name: results
                  value: "{{tasks.move.outputs.parameters}}"

    # --- One file: encrypt on hercules, then decrypt in xena ------------------
    - name: move-one-file
      inputs:
        parameters:
          - name: file
      outputs:
        parameters:
          - name: result
            valueFrom: {parameter: "{{tasks.decrypt-and-verify.outputs.parameters.result}}"}
      dag:
        tasks:
          - name: encrypt-and-send
            template: encrypt-and-send
            arguments:
              parameters:
                - {name: file, value: "{{inputs.parameters.file}}"}
          - name: decrypt-and-verify
            depends: encrypt-and-send
            template: decrypt-and-verify
            arguments:
              parameters:
                - {name: file, value: "{{inputs.parameters.file}}"}
                - {name: sha256, value: "{{tasks.encrypt-and-send.outputs.parameters.sha256}}"}
                - {name: bytes, value: "{{tasks.encrypt-and-send.outputs.parameters.bytes}}"}
                - {name: encrypted-bytes, value: "{{tasks.encrypt-and-send.outputs.parameters.encrypted-bytes}}"}

    # --- Step 1: list what's waiting on hercules -----------------------------
    - name: list-source-files
      outputs:
        parameters:
          - name: files
            valueFrom: {path: /tmp/files.json}
          - name: count
            valueFrom: {path: /tmp/count}
      retryStrategy: &retry
        limit: "4"
        retryPolicy: Always
        backoff: {duration: "5s", factor: "2", maxDuration: "5m"}
      script:
        image: dc-transfer/tools:1.0
        imagePullPolicy: IfNotPresent
        command: [bash]
        env: &ssh-env
          - {name: SRC_HOST, value: "{{workflow.parameters.source-host}}"}
          - {name: SRC_PORT, value: "{{workflow.parameters.source-port}}"}
          - {name: DST_HOST, value: "{{workflow.parameters.destination-host}}"}
          - {name: MAX_FILES, value: "{{workflow.parameters.max-files}}"}
        volumeMounts:
          - {name: transfer-credentials, mountPath: /credentials, readOnly: true}
        resources: &small
          requests: {cpu: 10m, memory: 16Mi}
        source: |
          set -euo pipefail
          src() { ssh -i /credentials/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10 \
                    -o UserKnownHostsFile=/credentials/known_hosts -p "$SRC_PORT" "lz@$SRC_HOST" "$@"; }

          echo "Listing hercules:/data/outbound"
          # Only plain names, so file names are safe to use in remote commands
          src 'ls -1 outbound' | grep -E '^[A-Za-z0-9._-]+\.txt$' | sort | head -n "$MAX_FILES" > /tmp/names || true
          jq -R . /tmp/names | jq -sc . > /tmp/files.json
          wc -l < /tmp/names | tr -d ' ' > /tmp/count
          echo "$(cat /tmp/count) file(s) to move this run"

    # --- Step 2a: encrypt on hercules, ship only ciphertext ------------------
    - name: encrypt-and-send
      inputs:
        parameters:
          - name: file
      outputs:
        parameters:
          - {name: sha256, valueFrom: {path: /tmp/sha256}}
          - {name: bytes, valueFrom: {path: /tmp/bytes}}
          - {name: encrypted-bytes, valueFrom: {path: /tmp/encrypted-bytes}}
      retryStrategy: *retry
      activeDeadlineSeconds: 300
      script:
        image: dc-transfer/tools:1.0
        imagePullPolicy: IfNotPresent
        command: [bash]
        env:
          - {name: FILE, value: "{{inputs.parameters.file}}"}
          - {name: SRC_HOST, value: "{{workflow.parameters.source-host}}"}
          - {name: SRC_PORT, value: "{{workflow.parameters.source-port}}"}
          - {name: DST_HOST, value: "{{workflow.parameters.destination-host}}"}
        volumeMounts:
          - {name: transfer-credentials, mountPath: /credentials, readOnly: true}
        resources: *small
        source: |
          set -euo pipefail
          opts=(-i /credentials/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10 -o UserKnownHostsFile=/credentials/known_hosts)
          src() { ssh "${opts[@]}" -p "$SRC_PORT" "lz@$SRC_HOST" "$@"; }
          dst() { ssh "${opts[@]}" "lz@$DST_HOST" "$@"; }
          recipient=$(cat /credentials/age-recipient)

          echo "1/3 Fingerprinting hercules:outbound/$FILE"
          read -r sha bytes < <(src "sha256sum outbound/$FILE | cut -d' ' -f1; stat -c %s outbound/$FILE" | paste -sd' ')
          echo "    $bytes bytes, sha256 $sha"

          echo "2/3 Encrypting on hercules for xena's key ($recipient)"
          echo "    and streaming the ciphertext to xena:encrypted/$FILE.age"
          src "age -r $recipient outbound/$FILE" \
            | dst "cat > encrypted/.$FILE.age.part && mv encrypted/.$FILE.age.part encrypted/$FILE.age"

          echo "3/3 Checking what landed in xena is ciphertext"
          enc_bytes=$(dst "stat -c %s encrypted/$FILE.age")
          header=$(dst "head -n1 encrypted/$FILE.age")
          [[ $header == "age-encryption.org/v1" ]] || { echo "Not an age file: $header" >&2; exit 1; }
          echo "    $enc_bytes bytes, header \"$header\""

          echo "$sha" > /tmp/sha256; echo "$bytes" > /tmp/bytes; echo "$enc_bytes" > /tmp/encrypted-bytes

    # --- Step 2b: decrypt in xena, verify, then archive on hercules ----------
    - name: decrypt-and-verify
      inputs:
        parameters:
          - name: file
          - name: sha256
          - name: bytes
          - name: encrypted-bytes
      outputs:
        parameters:
          - {name: result, valueFrom: {path: /tmp/result.json}}
      retryStrategy: *retry
      activeDeadlineSeconds: 300
      script:
        image: dc-transfer/tools:1.0
        imagePullPolicy: IfNotPresent
        command: [bash]
        env:
          - {name: FILE, value: "{{inputs.parameters.file}}"}
          - {name: SHA, value: "{{inputs.parameters.sha256}}"}
          - {name: BYTES, value: "{{inputs.parameters.bytes}}"}
          - {name: ENC_BYTES, value: "{{inputs.parameters.encrypted-bytes}}"}
          - {name: SRC_HOST, value: "{{workflow.parameters.source-host}}"}
          - {name: SRC_PORT, value: "{{workflow.parameters.source-port}}"}
          - {name: DST_HOST, value: "{{workflow.parameters.destination-host}}"}
        volumeMounts:
          - {name: transfer-credentials, mountPath: /credentials, readOnly: true}
          - {name: age-identity, mountPath: /age, readOnly: true}
        resources: *small
        source: |
          set -euo pipefail
          opts=(-i /credentials/id_ed25519 -o BatchMode=yes -o ConnectTimeout=10 -o UserKnownHostsFile=/credentials/known_hosts)
          src() { ssh "${opts[@]}" -p "$SRC_PORT" "lz@$SRC_HOST" "$@"; }
          dst() { ssh "${opts[@]}" "lz@$DST_HOST" "$@"; }
          work=$(mktemp -d)

          echo "1/4 Decrypting xena:encrypted/$FILE.age with xena's private key"
          dst "cat encrypted/$FILE.age" | age -d -i /age/identity > "$work/$FILE"

          echo "2/4 Verifying against the original's SHA-256"
          got=$(sha256sum "$work/$FILE" | cut -d' ' -f1)
          if [[ $got != "$SHA" ]]; then
            echo "Checksum mismatch: hercules $SHA, decrypted $got" >&2
            exit 1
          fi
          echo "    match: $got"

          echo "3/4 Writing xena:inbound/$FILE (temp name, then rename)"
          dst "cat > inbound/.$FILE.part && mv inbound/.$FILE.part inbound/$FILE" < "$work/$FILE"
          [[ $(dst "sha256sum inbound/$FILE" | cut -d' ' -f1) == "$SHA" ]] || { echo "Destination copy differs" >&2; exit 1; }

          echo "4/4 Archiving the original on hercules: outbound/ -> sent/"
          src "if [ -f outbound/$FILE ]; then mv outbound/$FILE sent/$FILE; fi"

          printf '{"file":"%s","bytes":%s,"encrypted_bytes":%s,"sha256":"%s"}\n' \
            "$FILE" "$BYTES" "$ENC_BYTES" "$SHA" | tee /tmp/result.json

    # --- Step 3: roll up the fan-out ----------------------------------------
    - name: summarize
      inputs:
        parameters:
          - name: results
      script:
        image: python:3.12-alpine
        command: [python]
        resources: *small
        source: |
          import json
          rows = [json.loads(r["result"]) for r in json.loads(r'''{{inputs.parameters.results}}''')]
          plain = sum(r["bytes"] for r in rows)
          enc = sum(r["encrypted_bytes"] for r in rows)
          print(f"Moved {len(rows)} file(s) hercules -> xena: {plain:,} bytes plaintext, {enc:,} bytes over the wire (encrypted)\n")
          for r in sorted(rows, key=lambda r: r["file"]):
              print(f"  {r['file']:<44} {r['bytes']:>8,} B  sha256:{r['sha256'][:12]}")

    - name: log
      inputs:
        parameters:
          - name: message
      container:
        image: busybox:1.36
        command: [echo, "{{inputs.parameters.message}}"]
        resources: *small
