# Two SFTP servers that stand in for "remote" systems.
#
#   sftp-source       an upstream system that drops CSV files into data/outbound
#                     (a sidecar generates 1-3 new files every minute)
#   sftp-destination  a downstream system that receives files in data/inbound
#
# Both accept only the demo client key and present fixed host keys, so the
# workflow can verify it's talking to the right server (see setup.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: file-servers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp-source
  namespace: file-servers
  labels: {app: sftp-source}
spec:
  replicas: 1
  selector:
    matchLabels: {app: sftp-source}
  template:
    metadata:
      labels: {app: sftp-source}
    spec:
      containers:
        - name: sftp
          image: atmoz/sftp:debian
          # user:password:uid:gid:dirs  (empty password = key auth only)
          args: ["demo::1001:100:data/outbound,data/archive"]
          ports:
            - containerPort: 22
          volumeMounts:
            - {name: data, mountPath: /home/demo/data}
            - {name: host-key, mountPath: /etc/ssh/ssh_host_ed25519_key, subPath: ssh_host_ed25519_key}
            - {name: client-pubkey, mountPath: /home/demo/.ssh/keys/client.pub, subPath: client.pub}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
        # Simulated upstream application writing files. It writes to a dot-file
        # and renames, so readers never see a half-written file.
        - name: file-generator
          image: busybox:1.36
          securityContext:
            runAsUser: 1001
            runAsGroup: 100
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /data/outbound /data/archive
              while true; do
                n=$(( RANDOM % 3 + 1 ))
                for i in $(seq 1 $n); do
                  name="orders-$(date +%Y%m%d-%H%M%S)-$i.csv"
                  {
                    echo "order_id,customer,amount"
                    for r in $(seq 1 $(( RANDOM % 50 + 10 ))); do
                      echo "$RANDOM$r,customer-$(( RANDOM % 100 )),$(( RANDOM % 1000 )).$(( RANDOM % 100 ))"
                    done
                  } > "/data/outbound/.$name.tmp"
                  mv "/data/outbound/.$name.tmp" "/data/outbound/$name"
                  echo "generated $name"
                done
                sleep 60
              done
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 5m, memory: 8Mi}
      volumes:
        - name: data
          emptyDir: {}
        - name: host-key
          secret: {secretName: sftp-source-host-key, defaultMode: 0400}
        - name: client-pubkey
          secret: {secretName: sftp-authorized-key}
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-source
  namespace: file-servers
spec:
  selector: {app: sftp-source}
  ports:
    - {name: ssh, port: 22, targetPort: 22}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp-destination
  namespace: file-servers
  labels: {app: sftp-destination}
spec:
  replicas: 1
  selector:
    matchLabels: {app: sftp-destination}
  template:
    metadata:
      labels: {app: sftp-destination}
    spec:
      containers:
        - name: sftp
          image: atmoz/sftp:debian
          args: ["demo::1001:100:data/inbound"]
          ports:
            - containerPort: 22
          volumeMounts:
            - {name: data, mountPath: /home/demo/data}
            - {name: host-key, mountPath: /etc/ssh/ssh_host_ed25519_key, subPath: ssh_host_ed25519_key}
            - {name: client-pubkey, mountPath: /home/demo/.ssh/keys/client.pub, subPath: client.pub}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
      volumes:
        - name: data
          emptyDir: {}
        - name: host-key
          secret: {secretName: sftp-destination-host-key, defaultMode: 0400}
        - name: client-pubkey
          secret: {secretName: sftp-authorized-key}
---
apiVersion: v1
kind: Service
metadata:
  name: sftp-destination
  namespace: file-servers
spec:
  selector: {app: sftp-destination}
  ports:
    - {name: ssh, port: 22, targetPort: 22}
